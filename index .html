<title>本棚バトル</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#14121a;--gold:#c9a96a;--tx:#e9e3d6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;overflow:hidden}
#g{position:relative;width:100%;height:100%;transform-origin:top left;overflow:hidden;display:flex;flex-direction:column;padding:6px 8px;gap:5px}
#g.pc{display:grid;grid-template-columns:minmax(0,1fr) 346px;grid-auto-rows:auto;align-content:start;column-gap:16px;row-gap:6px;padding:10px 16px}
#g.pc>.top{grid-column:1/-1}
#g.pc>.ctl{grid-column:2;grid-row:2}
#g.pc>.hand{grid-column:2;grid-row:3/span 9;flex-wrap:wrap;overflow-x:hidden;overflow-y:auto;align-content:flex-start;justify-content:flex-start;min-height:0;max-height:calc(100% - 4px);padding-top:16px;row-gap:22px}
#g.pc .shelf{height:200px;gap:3px}
#g.pc .shelf .spine:not(.cov){width:44px!important;font-size:14px;padding:5px 0}
#g.pc .shelf .spine b{font-size:14px}#g.pc .shelf .spine em{font-size:12px}
#g.pc .shelf .slot{width:44px}
#g.pc .shelf.many .spine:not(.cov){width:30px!important;font-size:12px;padding:4px 0}#g.pc .shelf.many .spine .sm{display:block}#g.pc .shelf.many .slot{width:30px}
#g.pc .shelf .spine.cov{width:120px}#g.pc .shelf .spine.cov span{font-size:14px}
#g.pc .sc{width:110px}#g.pc .info{font-size:14px}
#g.pc #end{font-size:14px;padding:8px 14px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#999}
.top b{font-size:16px;color:var(--gold)}
.hp{display:flex;align-items:center;gap:8px;font-size:13px}
.hp .nm{width:70px;color:var(--gold)}
.hp .n{font-size:22px;width:44px;text-align:right}
.bar{flex:1;height:9px;background:#000a;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .6s}
.tabs{display:flex;gap:6px}
.tab{flex:1;padding:7px 4px;font-size:13px;border-radius:8px 8px 0 0;background:#1d1a26;border:1px solid #3a3350;border-bottom:0;color:#999;text-align:center}
.tab.on{background:#2c2440;color:var(--tx);border-color:var(--gold)}
.tab small{display:block;font-size:10px}
.zone{display:flex;gap:6px;padding:6px;background:linear-gradient(#221e2e,#181520);border:1px solid #3a3350;border-radius:10px}
.shelf{flex:1;display:flex;gap:2px;align-items:flex-end;justify-content:center;height:128px;padding:4px 6px 0;border:3px solid #5b4630;border-bottom-width:8px;border-radius:4px;background:linear-gradient(#1f160e,#2d2013)}
.slot{width:28px;height:70%;border:1px dashed #ffffff18;border-radius:2px}
.spine{border-radius:2px 2px 1px 1px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0;font-size:11px;box-shadow:inset -3px 0 4px #0007,inset 2px 0 2px #fff4,inset 0 6px 0 #0003,inset 0 -6px 0 #0003;animation:in .3s}
.spine span{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;letter-spacing:0;white-space:nowrap;font-weight:bold}
.spine b{font-size:12px}.spine em{display:block;writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;text-orientation:upright;font-style:normal;font-size:10px;opacity:.9}
@keyframes in{from{transform:translateY(-40px);opacity:0}}
.sc{width:86px;border:2px solid #6a5a80;border-radius:6px;background:#0c0a12;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:12px;color:var(--gold)}
.sc big{display:block;font-size:26px;color:var(--tx);line-height:1.1}
.sc small{color:#9aa;display:block}
.sc hr{width:70%;border:0;border-top:1px solid #6a5a80;margin:4px auto}
.info{min-height:36px;font-size:13px;text-align:center;padding:4px 8px;background:#0007;border-radius:6px;display:flex;align-items:center;justify-content:center;line-height:1.35}
.ctl{display:flex;align-items:center;gap:6px}
.mana{padding:6px 8px;border:1px solid #4a6aa0;border-radius:6px;font-size:13px;background:#0b1020;white-space:nowrap}
.mana i{color:#6cf;font-style:normal}
button{font:inherit;color:var(--tx);border:1px solid var(--gold);background:#2a2214;border-radius:6px;padding:9px 10px;font-size:13px}
button:disabled{opacity:.35}
#draw{flex:1}
#end{flex:0 0 auto;font-size:12px;padding:6px 9px;margin-left:10px;opacity:.9}
#deck{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;padding:4px 2px}
.gvw{line-height:normal;font-size:13px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}.gvw .card{width:96px}
.hand{display:flex;gap:6px;overflow-x:auto;padding:16px 4px 4px;min-height:192px;flex-shrink:0}
.card{flex:0 0 100px;height:164px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:8px;border:3px solid var(--c);background:#e6dfcf;color:#2a2418;position:relative;padding:3px;transition:transform .15s}
.card.sel{transform:translateY(-14px);box-shadow:0 0 12px var(--gold)}
.card .vol{position:absolute;left:-7px;top:-8px;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:#2a4a8a;color:#fff;text-align:center;line-height:25px;font-size:16px;border:2px solid #fff;z-index:2}.card .vol small{font-size:9px}
.card .t{text-align:center;font-size:min(14px,calc(84px / var(--n)));font-weight:bold;margin-top:15px;padding:0 2px;line-height:22px;white-space:nowrap}
.card .art{height:30px;margin:3px 6px;border-radius:4px;background:var(--c);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;text-shadow:0 1px 2px #000a}
.card .v{position:absolute;left:3px;bottom:55px;padding:0 7px;height:18px;border-radius:9px;background:#333;color:#fff;line-height:18px;font-size:13px;font-weight:bold}.card .v small{font-size:8px;font-weight:normal;margin-right:2px}.card .au{text-align:center;font-size:10px;color:#4a3f2a}
.card .ab{position:absolute;left:3px;right:3px;bottom:3px;height:50px;font-size:11px;line-height:1.3;padding:3px 4px;background:#cfc6b0;border-radius:4px;overflow:hidden}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;font-size:18px;z-index:9;padding:20px}
#ov.on{display:flex}
.ghost{position:fixed;z-index:20;pointer-events:none;opacity:.92;transform:rotate(4deg) scale(1.05);width:100px}
#pv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;background:#0009;pointer-events:none}
#pv.on{display:flex}
#pv.tap{pointer-events:auto}
#pv.tap::after{content:'カードの外をタップで閉じる';position:absolute;bottom:24px;color:#ccc;font-size:13px}
.big .card{flex:none;width:300px;height:450px;padding:8px;border-width:5px;border-radius:14px;transform:none}
.big .vol{left:-16px;top:-16px;min-width:54px;height:54px;border-radius:27px;font-size:30px;line-height:48px;padding:0 10px}
.big .vol small{font-size:16px}
.big .t{margin-top:30px;padding:0 6px;font-size:min(28px,calc(190px / var(--n)));line-height:48px}
.big .au{font-size:19px}
.big .art{height:150px;margin:8px 10px;font-size:34px;border-radius:8px}
.big .v{left:8px;bottom:122px;height:36px;line-height:36px;font-size:26px;padding:0 14px;border-radius:18px}
.big .v small{font-size:15px}
.big .ab{left:8px;right:8px;bottom:8px;height:106px;font-size:20px;line-height:1.4;padding:8px 10px;border-radius:8px}
#cb{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:51;background:#000a}
#cb.on{display:flex}
#cb .box{width:min(340px,88vw);max-height:80vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#1d1a26;border:2px solid var(--gold);border-radius:12px;padding:16px;font-size:15px;line-height:1.7}
#cb .cbx{display:block;width:100%;margin-top:12px;padding:8px;border-radius:8px;background:#0c0a12;border:1px solid #6a5a80;color:var(--tx);font-size:14px}
#cb .ph{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:16px;margin-top:4px}
#cb .qm{width:26px;height:26px;border-radius:50%;border:1px solid var(--gold);background:#0c0a12;color:var(--gold);font-size:14px;line-height:1;padding:0}
#cb .cpl{margin:6px 0;padding:8px 10px;border-radius:8px;background:#0c0a12;font-size:13px;line-height:1.6}

<script>
// パッシブ効果: v=評価値+ c=コンボ+ m=倍率+ d=次ターンドロー+ a=次ターンマナ+  (e3=3冊 / e5=5冊全埋め)
const svg=b=>`<svg viewBox="0 0 24 24">${b}</svg>`;
const PUB=[
{n:'御呂璃社',mk:svg('<path d="M2 12Q12 3 22 12Q12 21 2 12Z" fill="#fff" stroke="#222" stroke-width="1.6"/><circle cx="12" cy="12" r="4" fill="#222"/>'),e3:{m:.1},e5:{m:.4}},
{n:'ヒーンブックス',mk:svg('<path d="M12 2C12 2 5 11 5 15a7 7 0 0014 0C19 11 12 2 12 2z" fill="#3a8fd8"/>'),e3:{v:12},e5:{v:35}},
{n:'文芸夏冬',mk:svg('<circle cx="12" cy="12" r="10" fill="#fff" stroke="#222" stroke-width="2"/><text x="12" y="17" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">文</text>'),e3:{c:1},e5:{c:3}},
{n:'TAKENOKO',mk:svg('<path d="M12 2C8 8 6 14 6 19h12c0-5-2-11-6-17z" fill="#d9b36a" stroke="#6a4a1a" stroke-width="1.2"/><path d="M8 13h8M7.5 17h9" stroke="#6a4a1a" stroke-width="1"/><path d="M5 22h14" stroke="#3f8a3f" stroke-width="2"/>'),e3:{d:1},e5:{d:2}},
{n:'辞辺出版',mk:svg('<path d="M2 3h20L12 22z" fill="#d22" stroke="#fff" stroke-width="1.5"/><text x="12" y="12" font-size="7" text-anchor="middle" font-weight="bold" fill="#fff">止</text>'),e3:{v:8,c:1},e5:{v:20,m:.3}}];
const CAT=[
{n:'純文学',col:'#6a4a7a',e3:{v:15},e5:{v:45}},
{n:'大衆文芸',col:'#a8552a',e3:{c:1},e5:{c:3}},
{n:'ライトノベル',col:'#c0507f',e3:{m:.2},e5:{m:.5}},
{n:'児童向け',col:'#b08a1f',e3:{d:1},e5:{d:2}},
{n:'哲学書',col:'#2d4a8a',e3:{c:1,v:8},e5:{c:2,v:25}},
{n:'海外文学',col:'#2f6f6f',e3:{m:.1,v:5},e5:{m:.3,v:20}},
{n:'自己啓発本',col:'#a63b3b',e3:{a:1},e5:{a:2}},
{n:'無し',col:'#5a1a24',hidden:true}];
const CATV=CAT.filter(c=>!c.hidden);
CAT[0].pas='1つの段が純文学で埋まると評価値+15・コンボ+2';CAT[1].pas='1つの段が大衆文芸で埋まるとコンボ+5';CAT[2].pas='1つの段がライトノベルで埋まると、その段の巻数を持つ本の数だけコンボ+1';CAT[3].pas='1つの段が児童向けで埋まるとマナ+5';CAT[4].pas='1つの段が哲学書で埋まると相手のパッシブを1つ無効化';CAT[5].pas='1つの段が海外文学で埋まるたび防御+20';CAT[6].pas='なし';
PUB[0].pas='3冊で段の本すべて評価+2、全て御呂璃社なら段の評価値+5';PUB[1].pas='3冊で相手に憂鬱+5、全てヒーンブックスなら段の評価値+10';PUB[2].pas='3冊で段のコンボ+1、全て文芸夏冬なら段の評価値+4';PUB[3].pas='3冊で次のターンTAKENOKOの本を1枚手札に、全てなら2枚';PUB[4].pas='3冊で相手の全段に【迷い】+1、全て辞辺出版なら【罠】+2【棘】+2も';

const pd=e=>[e.v&&`評価値+${e.v}`,e.c&&`コンボ+${e.c}`,e.m&&`倍率+${e.m}`,e.d&&`次ターンドロー+${e.d}`,e.a&&`次ターンマナ+${e.a}`].filter(Boolean).join('、');
const AB={none:'',draw:'本棚に差し込み時、1ドロー。',mana:'本棚に差し込み時、マナ+1。',pct:'本棚に差し込み時、評価値+20%。',set3:'同一作者の本が3冊並ぶと、コンボ+2。',spend:'差し込み時、マナ1消費で評価値+10。'};
const ABN={none:'なし',draw:'1ドロー',mana:'マナ+1',pct:'評価値+20%',set3:'同作者3冊でコンボ+2',spend:'マナ消費で評価値+10'};

const VT=['n','j','x','s'];
const clean=c=>{const vt=VT.includes(c.vt)?c.vt:'n';const v=vt=='n'?Math.max(1,Math.min(99,parseInt(c.v)||1)):vt=='j'?Math.max(1,Math.min(3,parseInt(c.v)||1)):0;
 return {id:c.id?String(c.id):'',tx:String(c.tx||'').slice(0,300),fx:(c.fx&&FX[c.fx])?String(c.fx):'',rare:['C','U','R'].includes(c.rare)?c.rare:'C',nv:!!c.nv,lend:!!c.lend,n:String(c.n||'無題').slice(0,40),vt,v,sr:vt=='s'?String(c.sr||c.n||'').slice(0,30):'',ds:String(c.ds||'').slice(0,200),sei:String(c.sei||'').slice(0,16),mei:String(c.mei||'').slice(0,16),
 k:CAT.some(x=>x.n==c.k)?c.k:CAT[0].n,p:PUB.some(x=>x.n==c.p)?c.p:PUB[0].n,val:Math.max(0,Math.min(99,parseInt(c.val)||0)),ab:AB[c.ab]?c.ab:'none',cp:Math.max(0,Math.min(3,c.cp==null?1:parseInt(c.cp)||0))}};
// 巻の表記: n=数字 j=上中下 x=無し s=シリーズ
const JV=['','上','中','下'];
const volTxt=c=>c.vt=='n'?String(c.v):c.vt=='j'?JV[c.v]:'';
const volLabel=c=>c.vt=='n'?c.v+'巻':c.vt=='j'?JV[c.v]+'巻':'';
const volOrd=c=>c.vt=='x'?0:c.vt=='s'?0:c.v;
const abTxt=c=>(c.vt=='s'?`<i class="srs">「${esc(c.sr)}」シリーズ</i>`:'')+(c.tx?esc(c.tx).replace(/【([^】]+)】/g,'<b>【$1】</b>').replace(/\n/g,'<br>'):(AB[c.ab]||''))+(c.lend?'<i class="srs">【貸本】このバトル中のみ</i>':'');

 tn(mtof(ch[T.arp[k]]+12),t,e*(T.drum?1.6:3),{type:T.drum?'square':'sine',vol:T.drum?.03:.06,dest:d,lp:T.drum?2200:0||undefined});
 if(T.drum){if(k%2==0)tn(mtof(ch[0]-12),t,e*.9,{type:'triangle',vol:.12,dest:d});if(k%4==0)tn(120,t,.18,{to:45,vol:.25,dest:d});if(k%2==1)nz(t,.04,{vol:.04,ff:7000,dest:d});if(k==4)nz(t,.12,{vol:.06,ft:'bandpass',ff:1800,dest:d})}

// ===== 評価値の計算 =====
function bookVal(s,sh,i,aura){const b=sh.books[i];let v=(b.nv?0:b.base)+b.acc+b.tmp+(aura.get(b)||0);
 if(b.fx&&b.fx.val&&!b.sil&&!sh.def.passiveOff)v+=b.fx.val({me:s,op:other(s),b,sh,i})||0;
 if(has(s,'loupe')&&!b.nv&&v<=10)v+=3;if(b.pi===0&&pubR(s,'p_oro'))v+=2;if(sh.def.glass&&!s.hurtB)v+=10;if(b.x2)v*=2;if(sh.def.minus)v=Math.max(0,v-sh.def.minus);if(sh.def.x4)v+=3*Math.max(0,(b.nv?0:b.base)-(sh.def.minus||0));return v}
function evS(s,sh,aura,sideC,cap){const bs=sh.books;let c=0,sum=0,pct=0;const why=[];const def=sh.def;
 bs.forEach((b,i)=>{const v=bookVal(s,sh,i,aura);sum+=v;
  if(i){const p=bs[i-1];
   if(!s.noAuthor&&au(b)&&au(p)==au(b)){const k=def.fan?2:1;c+=k;why.push(`${i}→${i+1}冊目 作者並び(${b.sei}) +${k}${def.fan?'(愛読者の飾り棚)':''}`)}
   if(volPair(bs,i)){c++;why.push(`${i}→${i+1}冊目 巻数の並び(${volLabel(p)}→${volLabel(b)}) +1`)}
   if(sameSeries(p,b)){c++;why.push(`${i}→${i+1}冊目 シリーズ並び(「${b.sr}」) +1`)}
   if(p.pi===2&&b.pi===2&&pubR(s,'p_bun')){c++;why.push(`${i}→${i+1}冊目 文芸夏冬の落款 +1`)}}
  if(b.fx&&b.fx.combo&&!b.sil&&!sh.def.passiveOff){const x=b.fx.combo({me:s,op:other(s),b,sh,i})||0;if(x){c+=x;why.push(`${b.n} コンボ+${x}`)}}
  if(b.cmb){c+=b.cmb;why.push(`${b.n} コンボ+${b.cmb}`)}
  if(!b.fx){if(b.oab=='set3'&&i>1&&au(bs[i-1])==au(b)&&au(bs[i-2])==au(b)){c+=2;why.push(`${b.n} 同一作者3冊 +2`)}if(b.oab=='pct'){pct+=.2;why.push(`${b.n} 評価値+20%`)}}});
 if(bs.length){if(def.c){c+=def.c;why.push(`${def.n} コンボ+${def.c}`)}if(def.m){pct+=def.m;why.push(`${def.n} 倍率${def.m>0?'+':''}${def.m}`)}
  if(has(s,'bookend')){c++;why.push('ブックエンド +1')}
  if(sideC){c+=sideC;why.push(`本棚の外の効果(思想・カード) ${sideC>0?'+':''}${sideC}`)}}
 if(sh.pCmb&&bs.length){c+=sh.pCmb;why.push(`パッシブ コンボ+${sh.pCmb}`)}
 if(sh.antC&&bs.length){c-=sh.antC;why.push(`古書の棚(純文学・哲学書以外) -${sh.antC}`)}
 if(def.glass&&bs.length&&!s.hurtB)why.push('ガラス書架 各本の評価値+10');if(def.glass&&s.hurtB)why.push('ガラス書架(ダメージで効果消失)');
 if(sh.deb.maze&&bs.length){c-=sh.deb.maze;why.push(`【迷い】 -${sh.deb.maze}`)}
 c=Math.max(0,Math.min(cap,c));if(cap<99&&c==cap)why.push('枯山水 コンボ上限10');
 const ps=(sh.pas||[]).map(t=>({n:t,d:''}));let nd=0,na=0;
 if(sh.pBonus){sum+=sh.pBonus;why.push(`パッシブ 評価値+${sh.pBonus}`)}
 if(def.ambition&&sh.ambN&&bs.length){sum+=5*sh.ambN;why.push(`向上心の塊棚 消失${sh.ambN}冊 評価値+${5*sh.ambN}`)}
 const mult=Math.max(0,1+.1*c+pct);return{c,sum,why,ps,nd,na,mult,fin:Math.floor(sum*mult)}}
function evalSide(s,over){const shelves=s.shelves.map((sh,si)=>over&&over.si==si?Object.assign({},sh,{books:over.books}):sh);
 const aura=new Map(),add=(b,n)=>aura.set(b,(aura.get(b)||0)+n);
 shelves.forEach(sh=>sh.books.forEach((b,i)=>{if(b.fx&&b.fx.aura&&!b.sil&&!sh.def.passiveOff)b.fx.aura({me:s,op:other(s),b,sh,i,shelves},add)}));
 s.buffs.forEach(f=>f.aura&&f.aura(s,shelves,add));
 const total=shelves.reduce((a,x)=>a+x.books.length,0);
 const sideC=s.cb+s.battleCb+(s.buffs.some(f=>f.k=='mini')&&total<=3?3:0);const fi=shelves.findIndex(x=>x.books.length);
 const cap=anyOn('193')?10:99;const r=shelves.map((sh,si)=>evS(s,sh,aura,si==fi?sideC:0,cap));
 let tot=r.reduce((a,e)=>a+e.fin,0);const notes=[];
 if(total&&has(s,'pen')){tot+=8;notes.push('万年筆 +8')}
 if(has(s,'stamp')&&shelves.every(x=>x.books.length&&room(x)==0)){tot=Math.floor(tot*1.2);notes.push('蔵書印 ×1.2')}
 if(s.evalPen){tot-=s.evalPen;notes.push(`空 -${s.evalPen}`)}
 if(s.know){tot+=s.know;notes.push(`知識 +${s.know}`)}
 return{r,tot:Math.max(0,tot),notes,nd:r.reduce((a,e)=>a+e.nd,0),na:r.reduce((a,e)=>a+e.na,0),combo:r.reduce((a,e)=>a+e.c,0)}}

// ===== パッシブ =====
function blocked(s,what){if(s.passBlock>0){s.passBlock--;note(`哲学書のパッシブで${s===P?'あなた':s.name}の${what}が無効になった`);return true}return false}
function checkFull(s){if(anyOn('178'))return;for(const sh of s.shelves){if(!sh.books.length||room(sh)>0||sh.catFired)continue;
 const k=[0,1,2,3,4,5].find(k=>sh.books.every(b=>isK(b,k,s)));if(k==null)continue;sh.catFired=true;if(s.catTurn.includes(k))continue;s.catTurn.push(k);
 if(s.trait=='ruin'){s.ruinSong=(s.ruinSong||0)+1;sh.pas.push('破滅の歌 次のラウンド、お互いの本棚が壊れる');note(`${s.name}の「破滅の歌」:次のラウンド、お互いの本棚が壊れる`);continue}

 const tot=a.reduce((s,c)=>s+(RW[c.rare]||4),0);let x=Math.random()*tot,k=0;for(;k<a.length-1;k++){x-=RW[a[k].rare]||4;if(x<0)break}r.push(a.splice(k,1)[0])}return r}

function genRoute(week){const r=Array(5).fill(null),boss=BOSS_WEEKS.includes(week);
 if(boss){r[4]='boss';if(Math.random()<.15)r[3]='elite'}
 else{const x=Math.random();if(x<.15){r[3]='elite';r[4]='elite'}else if(x<.5)r[3]='elite';else r[4]='elite'}
 const free=()=>r.map((v,i)=>v?-1:i).filter(i=>i>=0);
 if(week==1&&!r[0])r[0]='battle';while(r.filter(v=>v=='battle').length<2)r[pick1(free())]='battle';
 for(const i of free()){let k;do{const y=Math.random();k=y<.4?'shop':y<.65?'bookoff':y<.825?'swap':'smith'}while(r.includes(k));r[i]=k}
 return r}
const OTHER=['shop','bookoff','swap','smith'];
function genRoutes(week){const out=[],seen=new Set();let tries=0;
 while(out.length<3&&tries++<200){const r=genRoute(week),k=r.join();if(!seen.has(k)){seen.add(k);out.push(r)}}
 const need=week==2?'swap':week==4?'smith':null;
 if(need&&!out.some(r=>r.includes(need))){const r=pick1(out);const ix=r.map((v,i)=>OTHER.includes(v)?i:-1).filter(i=>i>=0);r[pick1(ix)]=need}
 if(out.every(r=>r.includes('shop'))){const r=pick1(out);const alt=['bookoff','swap','smith'].filter(k=>!r.includes(k));r.forEach((v,i)=>{if(v=='shop')r[i]=alt.length?alt.shift():'battle'})}
 return out}

 const ser=shuf([...by.values()]).sort((a,b)=>b.length-a.length)[0]||[];let out=ser.slice().sort((a,b)=>volOrd(a)-volOrd(b)).slice(0,n);

 mirror:{name:'破滅の作家 リー・シェナー',w:5,desc:'白の章→黒の章→中田翔とつなぎ、本棚を「破滅」で埋め尽くす作家。特殊能力「破滅の歌」:カテゴリパッシブが発動しない代わりに、次のラウンドお互いの本棚を壊す(ランダムな本棚の1枠をバトル中ずっと減らす/ランダムな本棚1つが使用不可/ランダムな本棚の1枠が使用不可)',make:()=>{

   ['要約力',1],['片付けで人生が変わる',2],['本を読む人だけが',1],['1日10冊読む方法',1],['大丈夫、あなたなら',1],['手放す勇気',1],['継続は力',1]];
  const deck=[];L.forEach(([n,k])=>{const c=CARDS.find(x=>x.n==n&&!x.lend)||DEFAULT_CARDS.find(x=>x.n==n);if(c)for(let i=0;i<k;i++)deck.push(cp1(c))});
  return{hp:350,valAdd:3,deck,shelves:['top','adv','adv'],trait:'ruin'}}}};
function nextVol(s){const own=s.hand.concat(s.shelves.flatMap(x=>x.books)).filter(b=>b.vt=='n');
 let c=s.deck.find(d=>d.vt=='n'&&own.some(h=>h.n==d.n&&d.v==h.v+1));if(!c)c=s.deck.find(d=>d.vt=='n'&&d.v==1);
 if(c){s.deck.splice(s.deck.indexOf(c),1);s.hand.push(c);note(`${s.name}の「次巻予約」:「${c.n}」${c.v}巻を手札に加えた`)}}
function bossOf(w){RUN.boss=RUN.boss||{};if(!RUN.boss[w]){const l=Object.keys(BOSSES).filter(k=>BOSSES[k].w==w);RUN.boss[w]=pick1(l);saveRun()}return BOSSES[RUN.boss[w]]}
function bossFor(w){const b=bossOf(w);return Object.assign({name:b.name},b.make())}
const ELITES=[
 {name:'辛口の書評家',cat:'哲学書',t:[['dorm'],['shadow','dorm'],['shadow','dorm','antique']]},
 {name:'神保町の目利き',cat:'純文学',t:[['antique'],['history','antique'],['ossuary','history','foreign']]},
 {name:'蔵書自慢の作家',cat:null,t:[['fan'],['collab','fan'],['tall','collab','ambition']]},
 {name:'ガチャ好きの古書店主',cat:null,t:[['flower'],['gacha','flower'],['gacha','glass','flower']]}];
const eliteTier=w=>w<=2?0:w==3?1:2;
function enemyFor(kind){const w=RUN.week,ns=RUN.shelves.length;const names={battle:['近所の読書家','古書店の常連','文学部の学生','図書館の司書見習い']};
 const cat=pick1(CATV).n,deck=catDeck(cat,null,10,0,4+w);
 if(kind=='boss')return bossFor(w);
 const sh=Array(ns).fill('basic');
 if(kind=='elite'){const e=pick1(ELITES);let es=e.t[eliteTier(w)].slice();while(es.length<ns)es.push('basic');if(w<=4)es=es.slice(0,2);
  return{name:e.name,hp:90+w*15,deck:e.cat?catDeck(e.cat,null,10,0,4+w):deck,shelves:es,valAdd:2+w}}
 return{name:pick1(names.battle),hp:60+w*12,deck,shelves:sh,valAdd:w-1}}
function enter(){const k=RUN.route[RUN.step];
 if(k=='battle'||k=='elite'||k=='boss'){const en=enemyFor(k);$('run').className='';
  startBattle({mode:'run',title:`第${RUN.week}週・${NODE[k].n}`,pDeck:RUN.deck,pShelves:RUN.shelves,relics:RUN.relics,enemy:en,onEnd:win=>battleEnd(k,win)});return}
 if(k=='shop'){const r=freeRelic();RUN.shop={themes:themeOffer(3),tsold:[],books:sample(genPool(),3).map(cp1),sold:[],relic:r,relicSold:false};RUN.stage='shop'}
 else if(k=='bookoff')RUN.stage='bookoff';
 else if(k=='swap'){RUN.deck.forEach(c=>{if(!c.u)c.u=Date.now().toString(36)+(UID++)});RUN.swap={si:null,sel:[],offers:null};RUN.stage='swap'}
 else if(k=='smith'){RUN.smith={mode:null,si:null,offers:RUN.shelves.map(x=>shuf(SWAPSH.filter(y=>y!=x)).slice(0,3))};RUN.stage='smith'}
 else{RUN.ev={id:R(EVENTS.length)};RUN.stage='event'}
 saveRun();showRun()}
function battleEnd(k,win){if(win&&k=='boss'&&RUN.week>=5&&BC&&BC.best)RUN.best=BC.best;if(!win){RUN.stage='over';RUN.result='敗北';saveRun();showRun();return}
 RUN.stats.wins++;let gold=(BC&&BC.bonusGold||0)+(k=='boss'?70:k=='elite'?40+R(10):20+R(10));if(RUN.relics.includes('libcard'))gold=Math.floor(gold*1.5);RUN.gold+=gold;
 const w={kind:k,gold};if(k=='boss')w.themes=themeOffer(3);else w.books=(k=='battle'?sample(genPool(),3):sample(genPool(),7).sort((a,b)=>b.val-a.val).slice(0,3)).map(cp1);
 if(k=='elite'){const r=freeRelic();if(r){RUN.relics.push(r);w.relic=r}}
 if(k=='boss'&&RUN.shelves.length<3){RUN.shelves.push('basic');w.shelf='basic'}
 RUN.reward=w;RUN.stage='reward';saveRun();showRun()}
function advance(){RUN.step++;RUN.reward=RUN.shop=RUN.ev=RUN.pickFor=RUN.swap=RUN.smith=null;
 if(RUN.step>=5){if(RUN.week>=5){RUN.stage='clear';saveRun();showRun();return}RUN.week++;RUN.step=0;RUN.route=null;RUN.routes=genRoutes(RUN.week);RUN.stage='routes'}
 else RUN.stage='week';saveRun();showRun()}
function evDone(m){RUN.evMsg=m;RUN.stage='evdone';saveRun();showRun()}
const ACT={
 quiz(){RUN.q={i:0,sc:{}};RUN.stage='quiz';saveRun();showRun()},
 pickcat(){RUN.stage='pickcat';showRun()},start(){RUN.stage='start';showRun()},
 ans(d){[...QUIZ[RUN.q.i].a[+d.i][1]].forEach(t=>RUN.q.sc[t]=(RUN.q.sc[t]||0)+1);RUN.q.i++;
  if(RUN.q.i<QUIZ.length){saveRun();showRun();return}
  const sc=p=>[...p.t].reduce((a,t)=>a+(RUN.q.sc[t]||0),0)/Math.sqrt(p.t.length)+Math.random()*.6;
  const p=PRESETS.slice().sort((a,b)=>sc(b)-sc(a))[0];
  RUN.deck=presetDeck(p);RUN.pname=p.n;RUN.note=`店主「あなたには『${p.n}』の棚がよく似合う。${p.d}だよ。あとは色々な棚から、使いやすい本を少しね」`;RUN.stage='review';saveRun();showRun()},
 cat(d){const c=CATV[+d.i].n;const r=authorDeck(c);RUN.deck=r.deck;RUN.pname=c;RUN.note=`${c}の中から${r.names[0]}の本をまとめて入れ、ほかのカテゴリの巻数無しの本で12冊にしました。`;RUN.stage='review';saveRun();showRun()},
 begin(){RUN.routes=genRoutes(1);RUN.stage='routes';saveRun();showRun()},
 route(d){RUN.route=RUN.routes[+d.i];RUN.step=0;RUN.stage='week';saveRun();showRun()},
 go(){enter()},
 takeBook(d){RUN.deck.push(RUN.reward.books[+d.i]);toast(`「${RUN.reward.books[+d.i].n}」をデッキに加えた`);RUN.reward.kind=='event'?evDone('本を1冊もらった。'):advance()},
 takeTheme(d){const t=themeOf(RUN.reward.themes[+d.i]);t.cards.forEach(c=>RUN.deck.push(cp1(c)));toast(`『${t.name}』の${t.cards.length}冊をデッキに加えた`);advance()},
 buyTheme(d){const i=+d.i,t=themeOf(RUN.shop.themes[i]),p=themePrice(t);if(RUN.gold<p||RUN.shop.tsold.includes(i))return;RUN.gold-=p;t.cards.forEach(c=>RUN.deck.push(cp1(c)));RUN.shop.tsold.push(i);toast(`『${t.name}』の${t.cards.length}冊を買った`);saveRun();showRun()},
 skipBook(){RUN.reward.kind=='event'?evDone('何も持たずに立ち去った。'):advance()},
 buy(d){const c=RUN.shop.books[+d.i];if(RUN.gold<price(c))return;RUN.gold-=price(c);RUN.deck.push(c);RUN.shop.sold.push(+d.i);toast(`「${c.n}」を買った`);saveRun();showRun()},
 buyRelic(){const r=RUN.shop.relic;if(RUN.gold<90)return;RUN.gold-=90;RUN.relics.push(r);RUN.shop.relicSold=true;toast(`「${RELICS[r].n}」を買った`);saveRun();showRun()},
 sell(d){if(RUN.deck.length<=MIN)return;const c=RUN.deck.splice(+d.i,1)[0];RUN.gold+=sellPrice(c);toast(`「${c.n}」を${sellPrice(c)}円で売った`);saveRun();showRun()},
 evc(d){const c=EVENTS[RUN.ev.id].ch[+d.i];const m=c.f();if(m!==null){evDone(m);return}if(RUN.pickFor)RUN.stage='pick';saveRun();showRun()},
 picked(d){const p=RUN.pickFor,c=RUN.deck[+d.i];let m='';
  if(p.act=='dup'){RUN.deck.push(cp1(c));m=`「${c.n}」を複製した。`}
  else if(p.act=='remove'){if(RUN.deck.length<=MIN)return;RUN.deck.splice(+d.i,1);m=`「${c.n}」を手放した。`}
  else if(p.act=='sign'){RUN.gold-=p.cost;c.val=Math.min(99,c.val+5);m=`「${c.n}」の評価値が${c.val}になった。`}
  RUN.pickFor=null;evDone(m)},
 nodeHelp(d){nodeHelp(+d.i<0?RUN.route:RUN.routes[+d.i])},
 swShelf(d){RUN.swap.si=+d.i;RUN.swap.sel=[];saveRun();showRun()},
 swBack(){RUN.swap.si=null;RUN.swap.sel=[];saveRun();showRun()},
 swTog(d){const sw=RUN.swap,c=RUN.deck[+d.i],k=sw.sel.indexOf(c.u);if(k>=0)sw.sel.splice(k,1);else if(sw.sel.length<SHELVES[RUN.shelves[sw.si]].cap)sw.sel.push(c.u);const y=$('run').scrollTop;saveRun();showRun();$('run').scrollTop=y},
 swGo(){const sw=RUN.swap;if(!sw.sel.length)return;sw.offers=swapOffers(RUN.shelves[sw.si],sw.sel.length);saveRun();showRun()},
 swTake(d){const sw=RUN.swap,o=sw.offers[+d.i];const old=SHELVES[RUN.shelves[sw.si]].n;RUN.deck=RUN.deck.filter(c=>!sw.sel.includes(c.u));o.cards.forEach(c=>RUN.deck.push(c));RUN.shelves[sw.si]=o.sh;toast(`「${old}」と${sw.sel.length}冊を出して、「${SHELVES[o.sh].n}」と${o.cards.length}冊を受け取った`);advance()},
 smMode(d){const sm=RUN.smith,p=smithPrice();if(!d.m){sm.mode=null;saveRun();showRun();return}
  if(d.m=='sw'){if(RUN.gold<p.sw)return;RUN.gold-=p.sw;RUN.smithN=(RUN.smithN||0)+1;toast(`入れ替えの料金 ${p.sw}円を支払った`)}sm.mode=d.m;sm.si=null;saveRun();showRun()},
 smUp(d){const i=+d.i,k=RUN.shelves[i],up=UPG[k],p=smithPrice().up;if(!up||RUN.gold<p)return;RUN.gold-=p;RUN.smithN=(RUN.smithN||0)+1;RUN.shelves[i]=up;toast(`${i+1}段目を「${SHELVES[up].n}」に強化した`);advance()},
 smPick(d){RUN.smith.si=d.i===''?null:+d.i;saveRun();showRun()},
 smSw(d){const sm=RUN.smith,i=sm.si,k=sm.offers[i][+d.j];RUN.shelves[i]=k;toast(`${i+1}段目を「${SHELVES[k].n}」に入れ替えた`);advance()},
 leave(){RUN.stage=='pick'?evDone('何もせずに立ち去った。'):advance()},
 home(){RUN=null;saveRun();showHome()},
 deck(){const d=RUN.deck.slice().sort((a,b)=>grpKey(a).localeCompare(grpKey(b),'ja')||volOrd(a)-volOrd(b));$('rsBody').innerHTML=`<h2>デッキ ${d.length}冊</h2>${grid(d)}`;
  $('rsBody').querySelectorAll('.cg .card').forEach(el=>el.onclick=()=>showPv(norm(LIST[+el.dataset.i])));openSheet('rs',1)},
 items(){$('rsBody').innerHTML=`<h2>本棚</h2>${RUN.shelves.map((s,i)=>`<div class="relrow"><span class="rl">${i+1}</span><span><b>${SHELVES[s].n}(${SHELVES[s].cap}冊)</b><small>${SHELVES[s].desc}</small></span></div>`).join('')}
  <h2>レリック</h2>${RUN.relics.length?RUN.relics.map(r=>`<div class="relrow"><span class="rl">${RELICS[r].ic}</span><span><b>${RELICS[r].n}</b><small>${RELICS[r].d}</small></span></div>`).join(''):'<p class="abd">まだ持っていません。強敵に勝つか、本屋で手に入ります。</p>'}`;openSheet('rs',1)}};
$('rsClose').onclick=()=>openSheet('rs',0);
$('rs').onclick=e=>{if(e.target.id=='rs')openSheet('rs',0)};

loadRun();
Promise.race([loadCards(),sl(4000).then(()=>null)]).then(a=>{if(Array.isArray(a)&&a.length)CARDS=a.map(clean);['hStart','hCont','hBattle','hDeck','hCard'].forEach(id=>$(id).disabled=false);showHome()});
